spring.application.name=lnb
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY}

# ── OAuth2: Google ────────────────────────────────────────────────────────────
# → APIs & Services → Credentials → Create OAuth 2.0 Client ID
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# ── OAuth2: Microsoft ─────────────────────────────────────────────────────────
# Credenciales en portal.azure.com → App registrations → New registration
spring.security.oauth2.client.registration.azure.client-id=${AZURE_CLIENT_ID}
spring.security.oauth2.client.registration.azure.client-secret=${AZURE_CLIENT_SECRET}
spring.security.oauth2.client.registration.azure.scope=openid,profile,email
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.redirect-uri={baseUrl}/login/oauth2/code/azure
spring.security.oauth2.client.provider.azure.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.azure.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.azure.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.azure.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.azure.user-name-attribute=email

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ── Frontend URL (para CORS y redirect post-login) ────────────────────────────
app.frontend-url=${FRONTEND_URL}

# Rate Limiting
rate-limit.publico.requests-por-minuto=60
rate-limit.auth.requests-por-minuto=10

# Web Push
app.webpush.public-key=${WEB_PUSH_PUBLIC_KEY}
app.webpush.private-key=${WEB_PUSH_PRIVATE_KEY}
app.webpush.subject=${WEB_PUSH_SUBJECT}
# Cache configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=60m

# Mercado Pago
mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN}
mercadopago.webhook.secret=${MERCADOPAGO_WEBHOOK_SECRET}
